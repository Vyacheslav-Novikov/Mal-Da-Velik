name: GitHub Pages preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
        id: pages
      - name: Build preview
        env:
          PREVIEW_URL: ${{ steps.pages.outputs.base_url }}
        run: python3 scripts/build-site.py "$PREVIEW_URL" dist
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for the uploaded artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          endpoint="repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?name=github-pages"
          for attempt in {1..10}; do
            if [[ "$(gh api "$endpoint" --jq '.total_count')" == 1 ]]; then
              exit 0
            fi
            sleep 3
          done
          echo 'The GitHub Pages artifact is not available for this run.' >&2
          exit 1
      - uses: actions/deploy-pages@v4
        id: deployment
